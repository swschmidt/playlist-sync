[project]
name = "playlist-sync"
version = "0.1.0"
description = "One-way Spotify to YouTube playlist sync that picks music videos, not just audio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "keyring>=25",
    "requests>=2.32",
    "tzdata>=2024.1",
]

[project.scripts]
playlist-sync = "playlist_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playlist_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
