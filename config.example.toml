# Copy to config.toml (git-ignored) and fill in.

region = "US"          # videos blocked in this region are treated as unavailable
daily_budget = 9000    # YouTube Data API units per day; the default project quota is 10,000

# Channels treated as official for any artist: labels and TV-archive channels. Channels ending in Records or
# Recordings already count when the title names the artist; Music Group, Entertainment or Nashville also need
# "official" in the title; "<artist> Videos" counts as the artist's own.
trusted_channels = ["The Midnight Special", "RHINO", "LegacyRecordingsVEVO", "Official Sweet Channel"]

[[playlist]]
name = "Example"
spotify_id = "SPOTIFY_PLAYLIST_ID"   # `playlist-sync playlists` lists yours
# youtube_id = "PL..."               # optional: adopt an existing YouTube playlist
privacy = "private"                  # for playlists the tool creates: public | unlisted | private
# two_way = false                    # default true: songs added or removed on YouTube carry back to Spotify
# hold = true                        # scheduled runs only match and dry-run it until you approve the plan

# A Spotify playlist that is only cleaned up, never synced (an app's feed, like Shazam's).
# [[tidy]]
# name = "My Shazam Tracks"
# spotify_id = "..."
# dedupe = true                      # each song once; the earliest copy stays
# drop_owned = true                  # remove songs already in another playlist you own
# max_remove = 25                    # a larger cleanup stops until `playlist-sync tidy --force`

[overrides]
# Spotify track ID = YouTube video ID. A pinned pick always wins and is never re-matched.
# "73TxYZd0lBCVRrHawrAglA" = "82cJgPXU-ik"  # Sweet Emotion – Aerosmith
