# Copy to config.toml (git-ignored) and fill in.

region = "US"          # videos blocked in this region are treated as unavailable
daily_budget = 9000    # YouTube Data API units per day; the default project quota is 10,000

# Channels treated as official for any artist: labels and TV-archive channels.
trusted_channels = ["The Midnight Special", "RHINO", "LegacyRecordingsVEVO", "Official Sweet Channel"]

[[playlist]]
name = "Example"
spotify_id = "SPOTIFY_PLAYLIST_ID"   # `playlist-sync playlists` lists yours
# youtube_id = "PL..."               # optional: adopt an existing YouTube playlist
privacy = "private"                  # for playlists the tool creates: public | unlisted | private

[overrides]
# Spotify track ID = YouTube video ID. A pinned pick always wins and is never re-matched.
# "73TxYZd0lBCVRrHawrAglA" = "82cJgPXU-ik"  # Sweet Emotion – Aerosmith
